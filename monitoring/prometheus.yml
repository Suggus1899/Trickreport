# Prometheus scrape configuration for Trickreport.
#
# The backend exposes a /metrics endpoint (Prometheus text format).
# Adjust the job_name and target hostname to match your deployment.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "trickreport"

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # ─── Trickreport backend ────────────────────────────────────────────────────
  - job_name: "trickreport-backend"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - app:8080
        labels:
          service: backend
          env: production

  # ─── Prometheus self-monitoring ─────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets:
          - localhost:9090
