# Trickreport — scheduled PostgreSQL backups.
#
# Runs pg_dump on a cron schedule and keeps daily/weekly/monthly retention.
# Backups are written to ./backups (mounted into the container).
#
# Usage (overlay with the main compose file):
#   docker compose -f docker-compose.yml -f docker-compose.backup.yml up -d backup
#
# Restore a backup with scripts/restore.sh:
#   ./scripts/restore.sh backups/trickreport_2024-01-01.sql.gz trickreport_restore_rehearsal

services:
  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine@sha256:08e7b70879af45a89305b91f4600cfbc88da2419a65948df870cddb082b8cf83
    profiles: [backup]
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-trickreport}
      - POSTGRES_USER=${POSTGRES_USER:-trickreport}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - BACKUP_SUFFIX=.sql.gz
      - TZ=${TZ:-UTC}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - trickreport_net

networks:
  trickreport_net:
    driver: bridge
