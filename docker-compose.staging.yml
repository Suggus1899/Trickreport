# Overlay: docker compose -p trickreport-staging -f docker-compose.yml -f docker-compose.staging.yml --env-file .env.staging up -d --build
services:
  app:
    environment:
      ENV: staging
      DATABASE_URL: postgres://${POSTGRES_USER:-trickreport}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-trickreport_staging}?sslmode=disable
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trickreport_staging}
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
  caddy:
    ports: !override
      - "${HTTP_PORT:-8081}:80"
      - "${HTTPS_PORT:-8443}:443"
volumes:
  pgdata_staging:
