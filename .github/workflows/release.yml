name: Release (SLSA)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag-name:
        description: Existing version tag; run this workflow at that tag or the same commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Verify release source
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      commit-date: ${{ steps.meta.outputs.commit-date }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag-name || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          test "$tag_commit" = "$GITHUB_SHA" || { echo 'Select the release tag ref; tag and workflow commit must match.' >&2; exit 1; }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit-date=$(git show -s --format=%cI "$tag_commit")" >> "$GITHUB_OUTPUT"

  verify:
    name: Validate the release commit
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    name: Backend (${{ matrix.os }}/${{ matrix.arch }})
    needs: [prepare, verify]
    permissions:
      id-token: write
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
    # SLSA requires a full version tag, rather than a SHA, to verify the builder identity.
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.1.0
    with:
      go-version: "1.26.10"
      config-file: backend/.slsa-goreleaser/${{ matrix.os }}-${{ matrix.arch }}.yml
      upload-assets: true
      upload-tag-name: ${{ needs.prepare.outputs.tag }}
      draft-release: "true"
      evaluated-envs: >-
        VERSION=${{ needs.prepare.outputs.version }},COMMIT=${{ github.sha }},COMMIT_DATE=${{ needs.prepare.outputs.commit-date }}

  frontend:
    name: Frontend runtime (Linux amd64)
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    outputs:
      base64-subjects: ${{ steps.subjects.outputs.base64-subjects }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci && npm run build -w @trickreport/it
      - name: Package complete runtime
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          runtime_dir=$(mktemp -d)
          cp -a apps/it/.next/standalone/. "$runtime_dir/"
          mkdir -p "$runtime_dir/apps/it/.next/static" "$runtime_dir/apps/it/public"
          cp -a apps/it/.next/static/. "$runtime_dir/apps/it/.next/static/"
          cp -a apps/it/public/. "$runtime_dir/apps/it/public/"
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({version:process.env.RELEASE_VERSION,commit:process.env.GITHUB_SHA,node:"24.22.1",platform:"linux-amd64",migrationCommand:"backend --migrate-up"})+"\n")' "$runtime_dir/release.json"
          tar -czf artifacts/trickreport-frontend-linux-amd64.tar.gz -C "$runtime_dir" .
      - name: Exercise the unpacked runtime
        run: |
          set -euo pipefail
          runtime_dir=$(mktemp -d)
          tar -xzf artifacts/trickreport-frontend-linux-amd64.tar.gz -C "$runtime_dir"
          (cd "$runtime_dir" && HOSTNAME=127.0.0.1 PORT=44321 API_URL=http://127.0.0.1:8080 node apps/it/server.js) > artifacts/frontend-runtime.log 2>&1 &
          runtime_pid=$!
          trap 'kill "$runtime_pid" 2>/dev/null || true; rm -rf "$runtime_dir"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:44321/login > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:44321/login > /dev/null
      - name: Compute provenance subjects
        id: subjects
        working-directory: artifacts
        run: |
          sha256sum trickreport-frontend-linux-amd64.tar.gz > frontend.sha256sum
          echo "base64-subjects=$(base64 -w0 frontend.sha256sum)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trickreport-frontend
          path: |
            artifacts/trickreport-frontend-linux-amd64.tar.gz
            artifacts/frontend.sha256sum
          if-no-files-found: error
          retention-days: 30

  frontend-provenance:
    name: Frontend provenance
    needs: [prepare, frontend]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      upload-assets: true
      upload-tag-name: ${{ needs.prepare.outputs.tag }}
      draft-release: "true"
      base64-subjects: ${{ needs.frontend.outputs.base64-subjects }}

  release-assets:
    name: Attach frontend runtime to draft release
    needs: [prepare, build, frontend-provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trickreport-frontend
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" artifacts/trickreport-frontend-linux-amd64.tar.gz artifacts/frontend.sha256sum
