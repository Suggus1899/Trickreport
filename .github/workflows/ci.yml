name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go + PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_DB: trickreport_test
          POSTGRES_USER: trickreport_test
          POSTGRES_PASSWORD: test-only-ci-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U trickreport_test -d trickreport_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://trickreport_test:test-only-ci-password@127.0.0.1:5432/trickreport_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Test with race detector and integration database
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          go test -json -race -count=1 -coverprofile=coverage.out ./... | tee ../artifacts/backend-tests.jsonl
          if grep -qE '"Action":"skip".*"Test":' ../artifacts/backend-tests.jsonl; then
            echo 'Tests were skipped; CI must exercise every critical integration test.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-validation
          path: |
            backend/coverage.out
            artifacts/backend-tests.jsonl
          if-no-files-found: error

  lint-backend:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install pinned linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Lint
        working-directory: backend
        run: golangci-lint run ./...

  frontend:
    name: Next.js workspaces (Node 24)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_DB: trickreport_e2e
          POSTGRES_USER: trickreport_test
          POSTGRES_PASSWORD: test-only-ci-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U trickreport_test -d trickreport_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://trickreport_test:test-only-ci-password@127.0.0.1:5432/trickreport_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:integration
      - run: npm run build

  security-backend:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
      - name: Cross-platform vulnerability analysis
        run: GOOS=windows GOARCH=amd64 govulncheck ./...

  security-frontend:
    name: Security (npm audit · Next.js workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high

  operations:
    name: Operational checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Restore safety regression
        run: bash scripts/restore.test.sh
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: test-only-ci-password
          JWT_SECRET: test-only-ci-jwt-secret-32-characters
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: test-only-ci-admin-password
          APP_PUBLIC_URL: https://helpdesk.example.com
          CADDY_SITE: helpdesk.example.com
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.onpremise.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.staging.yml config --quiet
      - name: Validate metrics rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.15.1 check rules /etc/prometheus/rules.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.15.1 test rules /etc/prometheus/rules.test.yml

  container-scan:
    name: Container security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build -t trickreport-backend:scan ./backend
      - run: docker build -t trickreport-frontend:scan -f apps/it/Dockerfile .
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.1
          image-ref: trickreport-backend:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.1
          image-ref: trickreport-frontend:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
