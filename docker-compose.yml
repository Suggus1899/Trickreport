x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - trickreport_net

services:
  postgres:
    <<: *service-defaults
    image: postgres:16.15-alpine3.24@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trickreport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-trickreport}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  app:
    <<: *service-defaults
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      ENV: ${ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-trickreport}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-trickreport}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXP_HOURS: ${JWT_EXP_HOURS:-8}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${APP_PUBLIC_URL:?APP_PUBLIC_URL must be the HTTPS public origin}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_HOST: ${LDAP_HOST:-}
      LDAP_PORT: ${LDAP_PORT:-636}
      LDAP_USE_TLS: ${LDAP_USE_TLS:-true}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PW: ${LDAP_BIND_PW:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_UID_ATTR: ${LDAP_UID_ATTR:-uid}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  frontend:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/it/Dockerfile
    environment:
      API_URL: http://app:8080
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp, /workspace/apps/it/.next/cache]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  caddy:
    <<: *service-defaults
    image: caddy:2.11.7-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    environment:
      CADDY_SITE: ${CADDY_SITE:?CADDY_SITE must be the public hostname}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  trickreport_net:
    driver: bridge
