# Keepalived — IP virtual del ingreso (referencia HA).
#
# Una copia por nodo de aplicación, cambiando state/priority:
# el nodo con mayor prioridad anuncia la VIP; los demás toman el
# relevo si el script de salud de HAProxy falla. La infraestructura
# debe admitir la VIP (misma red L2 o soporte del proveedor).
global_defs {
    router_id trickreport_it
    enable_script_security
    script_user nobody
}

vrrp_script check_haproxy {
    script "/usr/bin/pgrep -x haproxy"
    interval 2
    weight -30
    fall 2
    rise 2
}

vrrp_instance VI_TRICKREPORT {
    state BACKUP
    interface <net-interface>
    virtual_router_id 51
    priority <150-primary | 120 | 100>
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass <from-secret-store>
    }
    virtual_ipaddress {
        <virtual-ip>/24 dev <net-interface>
    }
    track_script {
        check_haproxy
    }
}
