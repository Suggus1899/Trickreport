# HAProxy — ingreso de datos hacia Patroni e ingreso público (referencia HA).
#
# Se instala en los nodos de aplicación. Dos funciones:
#  1) Puertos 5000/5001: enrutado a PostgreSQL según el rol que anuncia
#     la API REST de Patroni (8008): /primary solo responde 200 en el
#     primario; /replica solo en réplicas. La API usa el 5000, así un
#     failover de Patroni no exige tocar la aplicación.
#  2) Puerto 443 (bind comentado): terminación TLS hacia el puerto
#     publicado por la pila Swarm del frontend. Descomenta y apunta los
#     certificados cuando la VIP y el dominio sean definitivos; hasta
#     entonces puede seguir usándose un terminador equivalente.
global
    maxconn 2000
    log stdout format raw local0 info

defaults
    mode tcp
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    retries 3

# Estadísticas locales del balanceador (no exponer públicamente).
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats

# Escrituras y lecturas consistentes: solo el primario de Patroni.
listen postgres_primary
    bind *:5000
    option httpchk OPTIONS /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server data-a <data-a-ip>:5432 maxconn 300 check port 8008
    server data-b <data-b-ip>:5432 maxconn 300 check port 8008
    server data-c <data-c-ip>:5432 maxconn 300 check port 8008

# Lecturas repartidas entre réplicas (uso futuro: informes pesados).
listen postgres_replicas
    bind *:5001
    balance leastconn
    option httpchk OPTIONS /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server data-a <data-a-ip>:5432 maxconn 300 check port 8008
    server data-b <data-b-ip>:5432 maxconn 300 check port 8008
    server data-c <data-c-ip>:5432 maxconn 300 check port 8008

