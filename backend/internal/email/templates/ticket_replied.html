<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #4f46e5; color: white; padding: 20px; border-radius: 8px 8px 0 0; text-align: center; }
        .content { padding: 20px; border: 1px solid #e5e7eb; border-top: none; border-radius: 0 0 8px 8px; }
        .quote { border-left: 4px solid #e5e7eb; padding-left: 15px; margin: 20px 0; color: #4b5563; font-style: italic; white-space: pre-wrap; }
        .ticket-id { font-weight: bold; color: #4f46e5; }
        .button { display: inline-block; padding: 10px 20px; background-color: #4f46e5; color: white; text-decoration: none; border-radius: 6px; margin-top: 20px; font-weight: 500; }
        .footer { margin-top: 20px; font-size: 12px; color: #6b7280; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <h2>New reply on your ticket</h2>
    </div>
    <div class="content">
        <p>Hello,</p>
        <p>An agent has replied to your ticket <span class="ticket-id">#{{.TicketID}}</span> ({{.Title}}):</p>
        <div class="quote">
            {{.CommentBody}}
        </div>
        <a href="{{.Link}}" class="button">View or Reply</a>
    </div>
    <div class="footer">
        <p>This is an automated message from your Support Team.</p>
    </div>
</body>
</html>
