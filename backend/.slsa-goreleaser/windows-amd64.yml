# SLSA Go Releaser config — windows/amd64
# https://github.com/slsa-framework/slsa-github-generator
version: 1

env:
  - GO111MODULE=on
  - CGO_ENABLED=0

flags:
  - -trimpath

goos: windows
goarch: amd64

dir: ./backend
main: ./backend/cmd/api

binary: trickreport-backend-windows-amd64.exe

ldflags:
  - "-X main.Version={{ .Env.VERSION }}"
  - "-X main.Commit={{ .Env.COMMIT }}"
  - "-X main.CommitDate={{ .Env.COMMIT_DATE }}"
