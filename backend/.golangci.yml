version: "2"
run:
  timeout: 5m
  go: "1.26"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - gocyclo
    - misspell
    - revive
  settings:
    gocyclo:
      min-complexity: 20
    gosec:
      excludes:
        - G104
